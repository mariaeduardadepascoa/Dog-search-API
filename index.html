<!DOCTYPE html>

    <title>Busca de doguinhos</title>
</head>
<body>

    <div class="container-bottom">
        <div class="div-mostrando-cachorros">

        </div>
    </div>

    <div id="loading" style="display: none;">
        <img src="imagens/loading.svg" alt="">
    </div>



    <script src="script.js"></script>
